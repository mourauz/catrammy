<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='imagens/gato-preto.ico') }}">
  <title>Cadastro - CATRAMMY</title>
</head>
<body class="auth">
  <div class="auth-card">
    <form id="register-form" method="POST" action="{{ url_for('register') }}" novalidate>
      <h2>Criar Conta</h2>
      <p class="auth-subtitle">Cadastre-se para participar da votação</p>

      <div class="social-icons">
        <span class="icon"><i class="fa-brands fa-google-plus-g"></i></span>
        <span class="icon"><i class="fa-brands fa-facebook-f"></i></span>
        <a href="https://github.com/mourauz" target="_blank" rel="noopener" class="icon"><i class="fa-brands fa-github"></i></a>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul class="flash-messages">
                {% for category, message in messages %}
                    <li class="{{ category }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
      {% endwith %}

      <div class="input-box">
        <input type="text" id="username" name="username" autocomplete="username" placeholder=" " required />
        <label for="username">Usuário</label>
      </div>

      <div class="input-box">
        <input type="email" id="email" name="email" autocomplete="email" placeholder=" " required />
        <label for="email">Email</label>
      </div>

      <div class="input-box">
        <input type="password" id="password" name="password" autocomplete="new-password" placeholder=" " minlength="6" required />
        <label for="password">Senha</label>
        <button type="button" class="toggle-password" data-target="password" aria-label="Mostrar senha">Mostrar</button>
      </div>
      <p class="auth-subtitle" style="margin: -0.8em 0 1em; font-size: 0.78em;">Mínimo de 6 caracteres</p>

      <button type="submit" class="btn" id="register-submit">Cadastrar</button>

      <div class="login-link">
        Já tem conta? <a href="{{ url_for('login') }}">Entrar</a>
      </div>
    </form>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
