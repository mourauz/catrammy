<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='styleee.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='imagens/gato-preto.ico') }}">
  <title>Cadastro</title>
</head>
<body>
  <div class="container" id="container">
    <div class="form-container sign-up">
      <form id="register-form" action="{{ url_for('register') }}" method="POST">
        <h1>Create Account</h1>
        <div class="social-icons">
            <a href="#" class="icon"><i class="fa-brands fa-google-plus-g"></i></a>
            <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
        </div>
        <span>Ou use um Email para se cadastrar</span>
        <input type="text" id="new-username" name="username" placeholder="Usuário" required>
        <input type="email" id="new-email" name="email" placeholder="Email" required>
        <input type="password" id="new-password" name="password" placeholder="Senha" required>
        <button type="submit">Cadastrar</button>
        <p id="message" class="message"></p>
    </form>    
    </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
