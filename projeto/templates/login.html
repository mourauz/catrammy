<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='imagens/gato-preto.ico') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <title>Login - CATRAMMY</title>
</head>
<body class="auth">
    <div class="auth-card">
        <form id="login-form" action="{{ url_for('login') }}" method="POST" novalidate>
            <h2>Login</h2>
            <p class="auth-subtitle">Entre para votar no CATRAMMY</p>

            <div class="social-icons">
                <span class="icon"><i class="fa-brands fa-google-plus-g"></i></span>
                <span class="icon"><i class="fa-brands fa-facebook-f"></i></span>
                <a href="https://github.com/mourauz" target="_blank" rel="noopener" class="icon"><i class="fa-brands fa-github"></i></a>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <ul class="flash-messages">
                        {% for category, message in messages %}
                            <li class="{{ category }}">{{ message }}</li>
                        {% endfor %}
                    </ul>
                {% endif %}
            {% endwith %}

            <div class="input-box">
                <input type="text" id="username" name="username" placeholder=" " autocomplete="username" required />
                <label for="username">Usuário</label>
            </div>

            <div class="input-box">
                <input type="password" id="password" name="password" placeholder=" " autocomplete="current-password" required />
                <label for="password">Senha</label>
                <button type="button" class="toggle-password" data-target="password" aria-label="Mostrar senha">Mostrar</button>
            </div>

            <div class="forgot-pass">
                <a href="#">Esqueceu sua senha?</a>
            </div>

            <button type="submit" class="btn" id="login-submit">Entrar</button>

            <div class="signup-link">
                Ainda não tem conta? <a href="{{ url_for('register') }}">Cadastre-se</a>
            </div>
        </form>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
