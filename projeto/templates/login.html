<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='imagens/gato-preto.ico') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='stylee.css') }}">
    <title>Login</title>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <form id="login-form" action="{{ url_for('login') }}" method="POST">
               <h2>Login</h2> 
               <div class="social-icons">
                <a href="#" class="icon"><i class="fa-brands fa-google-plus-g"></i></a>
                <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
               </div>

                <div class="input-box">
                    <input type="text" id="username" name="username" placeholder="Usuário" required />
                    <label for="username">Usuário</label>
                </div>
                <div class="input-box">
                    <input type="password" id="password" name="password" placeholder="Senha" required />
                    <label for="password">Senha</label>
                </div>
                <div class="forgot-pass">
                    <a href="#">Esqueceu sua senha?</a>
                </div>
                <p id="error-message" style="display:none; color: red;"></p>
                <div class="error-messages">
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            <ul>
                                {% for category, message in messages %}
                                    <li style="color: red;">{{ message }}</li>
                                {% endfor %}
                            </ul>
                        {% endif %}
                    {% endwith %}
                </div>

                <button type="submit" class="btn">Login</button>
                <div class="signup-link">
                    <a href="{{ url_for('register') }}">Cadastre-se</a>
                </div>
            </form>
        </div>
