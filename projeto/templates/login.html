<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='imagens/gato-preto.ico') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/static/stylee.css">
    <title>Login</title>
</head>
<body>

    <div class="container" id="container">
        <!-- Formulário de Cadastro -->
        <div class="form-container sign-up">
        
        </div>

        <!-- Formulário de Login -->
        <div class="form-container sign-in">
            <form method="POST" action="{{ url_for('login') }}">
                <h1>Sign In</h1>
                <div class="social-icons">
                    <a href="#" class="icon"><i class="fa-brands fa-google-plus-g"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
                </div>
                <input type="text" id="username" name="username" placeholder="Usuário" required />
                <input type="password" id="password" name="password" placeholder="Senha" required />
                <p id="error-message" style="display:none; color: red;"></p>

                 <!-- Exibição de mensagem de erro, se houver -->
                 {% with messages = get_flashed_messages(with_categories=true) %}
                 {% if messages %}
                     {% for category, message in messages %}
                         <p id="error-message" class="{{ category }}">{{ message }}</p>
                     {% endfor %}
                 {% endif %}
             {% endwith %}

                <a href="#">Esqueceu sua senha?</a>
                <button type="submit">Login</button>
            </form>
            
            <!-- Mensagem de erro, se necessário -->
            <p id="error-message" style="display:none; color:red;"></p>
        </div>

        <!-- Botão para alternar entre os formulários -->
        <div class="toggle-container">
            <!-- Pode adicionar aqui um botão para alternar entre Sign In e Sign Up -->
        </div>
    </div>
</body>
</html>
